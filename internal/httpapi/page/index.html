<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support request</title>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js" defer></script>
</head>
<body>
<main>
  <h1>Support request</h1>
  <p class="lead">Describe the problem. We route it to the right team and show the result here.</p>

  <form id="ticket-form" novalidate>
    <label for="subject">Subject</label>
    <input id="subject" name="subject" type="text" maxlength="200" required autocomplete="off">

    <label for="body">Message</label>
    <textarea id="body" name="body" rows="8" maxlength="5000" required></textarea>

    <p id="form-error" class="error" role="alert" hidden></p>
    <button id="submit" type="submit">Send</button>
  </form>

  <section id="result" hidden aria-live="polite">
    <p class="status-label">Status: <span id="status-name"></span></p>
    <p id="status-message" class="status-message"></p>
    <p id="stream-note" class="note" hidden></p>
    <button id="again" type="button" hidden>Send another request</button>
  </section>
</main>
</body>
</html>
